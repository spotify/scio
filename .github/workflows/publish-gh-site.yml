name: Publish GitHub Site

on:
  workflow_dispatch # Manually triggered

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  site:
    name: Generate Site
    strategy:
      matrix:
        os: [ubuntu-22.04]
        scala: [2.13]
        java: [corretto@17, corretto@21, corretto@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (corretto@17)
        id: setup-java-corretto-17
        if: matrix.java == 'corretto@17'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@17' && steps.setup-java-corretto-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@21)
        id: setup-java-corretto-21
        if: matrix.java == 'corretto@21'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@21' && steps.setup-java-corretto-21.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Setup Java (corretto@25)
        id: setup-java-corretto-25
        if: matrix.java == 'corretto@25'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: sbt

      - name: sbt update
        if: matrix.java == 'corretto@25' && steps.setup-java-corretto-25.outputs.cache-hit == 'false'
        run: sbt +update

      - name: gcloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          export_environment_variables: true
          create_credentials_file: true

      - name: Setup GitHub Action
        run: scripts/gha_setup.sh

      - name: Generate site
        env:
          SOCCO: true
        run: sbt '++ ${{ matrix.scala }}' scio-examples/compile site/makeSite

      - name: Publish site
        if: matrix.java == 'corretto@17'
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/target/site
          keep_files: true
